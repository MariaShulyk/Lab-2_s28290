name: Lab2 - Data Processing

on:
  push:
  workflow_dispatch:

jobs:
  lab2:
    runs-on: ubuntu-latest
    env:
      SHEET_ID: ${{ secrets.SHEET_ID }}
      GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
      STUDENT_NUMBER: ${{ secrets.STUDENT_NUMBER }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate CSV
        run: |
          python3 scripts/generator_danych.py -s ${STUDENT_NUMBER}
          
      - name: List worksheet titles
        env:
          SHEET_ID: ${{ secrets.SHEET_ID }}
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
        run: |
         python - <<'PY'
         import os, json, gspread
         from google.oauth2.service_account import Credentials
         info = json.loads(os.environ["GOOGLE_SA_JSON"])
         creds = Credentials.from_service_account_info(info, scopes=[
             "https://www.googleapis.com/auth/spreadsheets",
             "https://www.googleapis.com/auth/drive",
         ])
         gc = gspread.authorize(creds)
         sh = gc.open_by_key(os.environ["SHEET_ID"])
         print("Worksheets:", [ws.title for ws in sh.worksheets()])
         PY

      - name: Upload to Google Sheets
        run: |
          GEN_CSV=$(ls -1 data_student_*.csv | tail -n 1)
          python3 scripts/sheets_sync.py --mode upload --sheet-id "${SHEET_ID}" --worksheet "data" --csv "$GEN_CSV"

      - name: Download from Google Sheets
        run: |
          python3 scripts/sheets_sync.py --mode download --sheet-id "${SHEET_ID}" --worksheet "data" --out "sheet_data.csv"

      - name: Clean, standardize, report, log (reads from Sheets)
        run: |
          python3 scripts/main.py --source sheets --sheet-id "${SHEET_ID}" --worksheet "data" --out "cleaned_data.csv" --report "report.txt"

      - name: Show report in logs
        run: |
          echo "     report.txt     "
          cat report.txt
          echo "                    "

      - name: Show last 50 lines of log.txt
        run: |
          echo "   log.txt (tail)   "
          tail -n 50 log.txt
          echo "                    "    

      - name: Upload artifacts (report, logs, cleaned csv)
        uses: actions/upload-artifact@v4
        with:
          name: lab2-outputs
          path: |
            report.txt
            log.txt
            cleaned_data.csv
